<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; margin-top: 10px; }
        th, td { border: 1px solid #cccccc; text-align: left; padding: 10px; }
        th { background-color: #f4f4f4; }
        button { padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #003d82; }
    </style>
</head>
<body>
    <h1>Student Management System</h1>
    <button>Login</button>
    
    <h2>Student Records</h2>
    <table>
        <tr>
            <th>Student No.</th>
            <th>Name</th>
            <th>Course</th>
            <th>Year Level</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>2026-001</td>
            <td>Juan Dela Cruz</td>
            <td>BSIT</td>
            <td>2nd Year</td>
            <td>juan@example.com</td>
        </tr>
    </table>
</body>
</html>
